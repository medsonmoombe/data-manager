services:
  - type: redis
    name: omnicore-redis
    region: oregon
    plan: free
    ipAllowList: []

  - type: web
    name: omnicore-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        fromService:
          name: omnicore-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: omnicore-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: omnicore-redis
          type: redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        value: 9000
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
